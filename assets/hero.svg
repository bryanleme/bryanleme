<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Primeiro o processo. Depois o dado.">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.45" stop-color="#ff9a3c"/>
      <stop offset="0.5" stop-color="#fff1dd"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff9a3c"/>
      <animate attributeName="x1" values="-300;1000;1000" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1300;1300" keyTimes="0;0.55;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
    .rise { opacity: 0; transform: translateY(14px); animation: rise 0.9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .4s; } .d3 { animation-delay: .75s; } .d4 { animation-delay: 1s; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .drift-a { animation: da 14s ease-in-out infinite alternate; }
    .drift-b { animation: db 17s ease-in-out infinite alternate; }
    @keyframes da { from { transform: translate(0,0); } to { transform: translate(120px,30px); } }
    @keyframes db { from { transform: translate(0,0); } to { transform: translate(-140px,-20px); } }
    .draw { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 1.2s cubic-bezier(.6,0,.2,1) 1.1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .draw { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      .drift-a, .drift-b, .blink { animation: none !important; }
    }
  </style>

  <rect width="1000" height="340" rx="18" fill="#0f0b08"/>
  <g class="drift-a"><circle cx="220" cy="90" r="120" fill="#ff9a3c" opacity="0.22" filter="url(#blur)"/></g>
  <g class="drift-b"><circle cx="820" cy="280" r="130" fill="#3fb8a0" opacity="0.16" filter="url(#blur)"/></g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="18" fill="none" stroke="#2c2119"/>

  <text class="mono rise d1" x="56" y="68" font-size="13" letter-spacing="3" fill="#9b8c7e">BRYAN LEME  /  ITAPETININGA, SP</text>

  <text class="sans rise d2" x="56" y="162" font-size="58" font-weight="700" fill="#efe6dc" letter-spacing="-1.5">Primeiro o processo.</text>
  <text class="sans rise d3" x="56" y="232" font-size="58" font-weight="700" fill="#efe6dc" letter-spacing="-1.5">Depois o <tspan fill="url(#shimmer)">dado.</tspan></text>

  <line class="draw" x1="56" y1="256" x2="396" y2="256" stroke="#ff9a3c" stroke-width="2" stroke-linecap="round"/>

  <text class="mono rise d4" x="56" y="298" font-size="14" fill="#9b8c7e">especialista em processos e operações  ·  SQL  ·  Power BI  ·  KPIs  ·  automação</text>
  <rect class="blink" x="760" y="288" width="9" height="16" fill="#ff9a3c" opacity="0.9"/>
</svg>
