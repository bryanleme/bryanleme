<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Terminal simulado com o status do Bryan">
  <style>
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; font-size: 16px; }
    .ln { opacity: 0; transform: translateX(-8px); animation: in .6s cubic-bezier(.2,.8,.2,1) forwards; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: 1s; } .l3 { animation-delay: 1.5s; } .l4 { animation-delay: 2s; } .l5 { animation-delay: 2.5s; }
    @keyframes in { to { opacity: 1; transform: translateX(0); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; } }
  </style>
  <rect width="1000" height="250" rx="20" fill="#0c1230"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="20" fill="none" stroke="#2a3366"/>
  <circle cx="36" cy="32" r="6" fill="#2a3366"/><circle cx="58" cy="32" r="6" fill="#2a3366"/><circle cx="80" cy="32" r="6" fill="#2a3366"/>
  <text class="mono" x="500" y="37" text-anchor="middle" font-size="12" fill="#9aa6d6">terminal simulado</text>

  <text class="mono ln l1" x="40" y="86" fill="#ffffff"><tspan fill="#ff8a3d">$</tspan> bryan --status</text>
  <text class="mono ln l2" x="40" y="124" fill="#9aa6d6">processo ........... <tspan fill="#ffffff">entendido primeiro</tspan></text>
  <text class="mono ln l3" x="40" y="152" fill="#9aa6d6">indicador .......... <tspan fill="#ffffff">apontando onde agir</tspan></text>
  <text class="mono ln l4" x="40" y="180" fill="#9aa6d6">automação .......... <tspan fill="#ffffff">rodando enquanto eu tomo café</tspan></text>
  <text class="mono ln l5" x="40" y="208" fill="#9aa6d6">próximo passo ...... <tspan fill="#3ddc97">MBA em Data Science e Analytics (03/2027)</tspan></text>
  <rect class="blink" x="40" y="222" width="9" height="3" fill="#ff8a3d"/>
</svg>
