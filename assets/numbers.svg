<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="R$ 7 milhões em ganhos, coleta de 40 para 2 minutos, mais de 400 medidas em DAX, 50 municípios e mais de 60 usuários">
  <style>
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
    .rise { opacity: 0; transform: translateY(12px); animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
    .t1 { animation-delay: .1s; } .t2 { animation-delay: .3s; } .t3 { animation-delay: .5s; } .t4 { animation-delay: .7s; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) 1s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .shrink { transform-box: fill-box; transform-origin: left center; animation: shrink 6s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes shrink { 0%,20% { transform: scaleX(1); } 50%,85% { transform: scaleX(.05); } 100% { transform: scaleX(1); } }
    .line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.6s cubic-bezier(.6,0,.2,1) 1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: dot .5s ease-out forwards; }
    @keyframes dot { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; } }
  </style>
  <rect width="1000" height="250" rx="18" fill="#0f0b08"/>
  <rect x="0.5" y="0.5" width="999" height="249" rx="18" fill="none" stroke="#2c2119"/>

  <!-- 1: ganhos -->
  <g class="rise t1">
    <text class="mono" x="40" y="52" font-size="12" letter-spacing="2" fill="#9b8c7e">GANHOS VALIDADOS</text>
    <text class="sans" x="40" y="112" font-size="48" font-weight="700" fill="#efe6dc" letter-spacing="-1">R$ 7 mi</text>
    <text class="sans" x="40" y="140" font-size="14" fill="#9b8c7e">revisão de rotas, calculada</text>
    <text class="sans" x="40" y="160" font-size="14" fill="#9b8c7e">numa simulação própria</text>
    <path class="line" d="M40 214 L90 204 L140 208 L190 184 L230 170" fill="none" stroke="#ff9a3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2: coleta -->
  <g class="rise t2">
    <text class="mono" x="290" y="52" font-size="12" letter-spacing="2" fill="#9b8c7e">COLETA DE DADOS</text>
    <text class="sans" x="290" y="112" font-size="48" font-weight="700" fill="#efe6dc" letter-spacing="-1">40 → 2</text>
    <text class="sans" x="290" y="140" font-size="14" fill="#9b8c7e">minutos por etapa, agora</text>
    <text class="sans" x="290" y="160" font-size="14" fill="#9b8c7e">sem trabalho manual</text>
    <rect x="290" y="190" width="190" height="10" rx="5" fill="#2c2119"/>
    <rect class="shrink" x="290" y="190" width="190" height="10" rx="5" fill="#3fb8a0"/>
  </g>

  <!-- 3: medidas -->
  <g class="rise t3">
    <text class="mono" x="540" y="52" font-size="12" letter-spacing="2" fill="#9b8c7e">PAINEL EXECUTIVO</text>
    <text class="sans" x="540" y="112" font-size="48" font-weight="700" fill="#efe6dc" letter-spacing="-1">400+</text>
    <text class="sans" x="540" y="140" font-size="14" fill="#9b8c7e">medidas em DAX, ligadas</text>
    <text class="sans" x="540" y="160" font-size="14" fill="#9b8c7e">direto ao banco corporativo</text>
    <g fill="#ff9a3c">
      <circle class="dot" style="animation-delay:1.0s" cx="546" cy="200" r="5"/><circle class="dot" style="animation-delay:1.1s" cx="566" cy="200" r="5"/>
      <circle class="dot" style="animation-delay:1.2s" cx="586" cy="200" r="5"/><circle class="dot" style="animation-delay:1.3s" cx="606" cy="200" r="5"/>
      <circle class="dot" style="animation-delay:1.4s" cx="626" cy="200" r="5"/><circle class="dot" style="animation-delay:1.5s" cx="646" cy="200" r="5"/>
      <circle class="dot" style="animation-delay:1.6s" cx="666" cy="200" r="5" opacity=".6"/><circle class="dot" style="animation-delay:1.7s" cx="686" cy="200" r="5" opacity=".4"/>
    </g>
  </g>

  <!-- 4: alcance -->
  <g class="rise t4">
    <text class="mono" x="790" y="52" font-size="12" letter-spacing="2" fill="#9b8c7e">EM PRODUÇÃO</text>
    <text class="sans" x="790" y="112" font-size="48" font-weight="700" fill="#efe6dc" letter-spacing="-1">50</text>
    <text class="sans" x="790" y="140" font-size="14" fill="#9b8c7e">municípios e mais de 60</text>
    <text class="sans" x="790" y="160" font-size="14" fill="#9b8c7e">usuários ativos no app</text>
    <rect x="790" y="190" width="170" height="10" rx="5" fill="#2c2119"/>
    <rect class="grow" x="790" y="190" width="170" height="10" rx="5" fill="#ff9a3c"/>
  </g>
</svg>
