<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Processo, dado, visão, automação">
  <style>
    .sans { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; }
    .line { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 1.6s cubic-bezier(.6,0,.2,1) .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pop { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
    .p1 { animation-delay: .2s; } .p2 { animation-delay: .7s; } .p3 { animation-delay: 1.2s; } .p4 { animation-delay: 1.7s; }
    @keyframes pop { to { opacity: 1; transform: scale(1); } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite; opacity: 0; }
    .r2 { animation-delay: .5s; } .r3 { animation-delay: 1s; } .r4 { animation-delay: 1.5s; }
    @keyframes ring { 0% { transform: scale(1); opacity: .5; } 70%,100% { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; } .ring { opacity: 0 !important; } }
  </style>
  <rect width="1000" height="200" rx="18" fill="#0f0b08"/>
  <rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="none" stroke="#2c2119"/>

  <path id="track" class="line" d="M120 84 L880 84" stroke="#2c2119" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M120 84 L880 84" stroke="#ff9a3c" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="6 14" opacity="0.55"/>

  <circle r="6" fill="#fff1dd">
    <animateMotion dur="5s" repeatCount="indefinite" path="M120 84 L880 84" keyTimes="0;1" keyPoints="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <circle class="ring" cx="120" cy="84" r="16" fill="none" stroke="#ff9a3c"/>
    <circle class="pop p1" cx="120" cy="84" r="16" fill="#ff9a3c"/>
    <text class="sans" x="120" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#efe6dc">Processo</text>
    <text class="mono" x="120" y="162" text-anchor="middle" font-size="12" fill="#9b8c7e">entender primeiro</text>
  </g>
  <g>
    <circle class="ring r2" cx="373" cy="84" r="16" fill="none" stroke="#ff9a3c"/>
    <circle class="pop p2" cx="373" cy="84" r="16" fill="#efe6dc"/>
    <text class="sans" x="373" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#efe6dc">Dado</text>
    <text class="mono" x="373" y="162" text-anchor="middle" font-size="12" fill="#9b8c7e">SQL direto da fonte</text>
  </g>
  <g>
    <circle class="ring r3" cx="627" cy="84" r="16" fill="none" stroke="#3fb8a0"/>
    <circle class="pop p3" cx="627" cy="84" r="16" fill="#3fb8a0"/>
    <text class="sans" x="627" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#efe6dc">Visão</text>
    <text class="mono" x="627" y="162" text-anchor="middle" font-size="12" fill="#9b8c7e">Power BI · KPIs</text>
  </g>
  <g>
    <circle class="ring r4" cx="880" cy="84" r="16" fill="none" stroke="#3fb8a0"/>
    <circle class="pop p4" cx="880" cy="84" r="16" fill="#efe6dc"/>
    <text class="sans" x="880" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#efe6dc">Automação</text>
    <text class="mono" x="880" y="162" text-anchor="middle" font-size="12" fill="#9b8c7e">Power Automate · PowerShell</text>
  </g>
</svg>
