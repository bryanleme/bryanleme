<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="O time de agents: Proc, Sqli, Bia e Auto">

<style>
  .bob { animation: bob .6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .legA, .legB, .arma, .armb { transform-box: fill-box; transform-origin: 50% 8%; }
  .legA { animation: swA .6s ease-in-out infinite alternate; } .legB { animation: swB .6s ease-in-out infinite alternate; }
  .arma { animation: swB .6s ease-in-out infinite alternate; } .armb { animation: swA .6s ease-in-out infinite alternate; }
  @keyframes swA { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes swB { from { transform: rotate(22deg); }  to { transform: rotate(-22deg); } }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .pulse { animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
  .ant { animation: pulse .9s ease-in-out infinite alternate; }
  .spin { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .twinkle { animation: pulse 2.4s ease-in-out infinite alternate; }
  .win { animation: pulse 3s ease-in-out infinite alternate; }
  .lane { stroke-dasharray: 26 22; animation: lane 1s linear infinite; }
  @keyframes lane { to { stroke-dashoffset: -48; } }
  .say { opacity: 0; animation: say 9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes say { 0%,8% { opacity: 0; transform: scale(.7); } 14%,46% { opacity: 1; transform: scale(1); } 54%,100% { opacity: 0; transform: scale(.7); } }
  .wave { transform-box: fill-box; transform-origin: 50% 90%; animation: wave 1.1s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(-12deg); } to { transform: rotate(38deg); } }
  .float { animation: bob 1.4s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
